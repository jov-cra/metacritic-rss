name: Build Metacritic score feed

# How often the feed refreshes. RSS is pull-based, so an item can only appear
# when this job runs — pick the cadence you want:
#   "0 */2 * * *"   every 2 hours (current: low traffic, plenty fresh for score news)
#   "0 * * * *"     hourly        (fresher, ~flat request budget vs. 30-min @ fewer pages)
#   "*/30 * * * *"  every 30 min  (near-live, but doubles request budget at 15 pages)
# Note: GitHub's scheduler is best-effort and can lag 5-15 min under load, and
# your reader also polls on ITS own interval — so true "instant" isn't possible.
# With pubDate = qualifying time, each new title still surfaces at the top when it
# first scores, regardless of cadence. It does NOT run on push, so the commit it
# makes below cannot cause a loop.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: metacritic-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 25.10.2026: the job now holds TMDB_TOKEN)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned 25.10.2026)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        id: build
        env:
          # ---- your configuration lives here ----
          MC_THRESHOLD: "0"           # minimum Metascore (0 = every title that has a score; 61 = "generally favorable")
          MC_MEDIA: "movie,tv"        # movie, tv, or both
          MC_PAGES: "15"              # browse pages per media (~24/page ≈ ~3 months back) — catches late scorers
          MC_FEED_MAX: "500"          # items kept in the feed (archive persists in state either way)
          MC_FEED_SELF: "https://jov-cra.github.io/metacritic-rss/feed.xml"
          MC_FEED_LINK: "https://www.metacritic.com/"   # readers derive the feed icon from this domain's favicon
          # Official YouTube trailer link for new items (TMDB). Read-only API token, only in this step.
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python metacritic_feed.py

      - name: Commit updated feed + state
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Metacritic feed [skip ci]"
            git push
          fi

      - name: Fail when enrichment, season discovery, streaming, trailer or cinema lookup is degraded
        # Feed and state were written and committed above (scores are correct);
        # only a supplementary part is broken, so the run turns red afterwards.
        if: steps.build.outputs.degraded == 'true' || steps.build.outputs.seasons_degraded == 'true' || steps.build.outputs.providers_degraded == 'true' || steps.build.outputs.trailers_degraded == 'true' || steps.build.outputs.kino_degraded == 'true'
        run: |
          echo "degraded=${{ steps.build.outputs.degraded }} seasons_degraded=${{ steps.build.outputs.seasons_degraded }} providers_degraded=${{ steps.build.outputs.providers_degraded }} trailers_degraded=${{ steps.build.outputs.trailers_degraded }} kino_degraded=${{ steps.build.outputs.kino_degraded }}"
          exit 1

      - name: Open an issue when the build fails
        # A red scheduled run is otherwise invisible: the last good feed keeps
        # being served, so the reader looks healthy while the feed goes stale.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEGRADED: ${{ steps.build.outputs.degraded }}
          SEASONS_DEGRADED: ${{ steps.build.outputs.seasons_degraded }}
          PROVIDERS_DEGRADED: ${{ steps.build.outputs.providers_degraded }}
          TRAILERS_DEGRADED: ${{ steps.build.outputs.trailers_degraded }}
          KINO_DEGRADED: ${{ steps.build.outputs.kino_degraded }}
          COMMITTED: ${{ steps.commit.outcome }}
        run: |
          if [ "$COMMITTED" = "success" ] && [ "$DEGRADED" = "true" ]; then
            title="Detail enrichment degraded"
            body="The feed was published, but detail pages returned no critic stats (layout change or soft-block); new items show only the basic line. Run: $RUN_URL"
          elif [ "$COMMITTED" = "success" ] && [ "$SEASONS_DEGRADED" = "true" ]; then
            title="Season discovery degraded"
            body="The feed was published, but new seasons are not being found (no season links, or no season page readable). Run: $RUN_URL"
          elif [ "$COMMITTED" = "success" ] && [ "$PROVIDERS_DEGRADED" = "true" ]; then
            title="Streaming lookup degraded"
            body="The feed was published, but JustWatch lookups keep failing (blocked, or the API changed); new TV items show (TV) instead of where they stream in Germany. Run: $RUN_URL"
          elif [ "$COMMITTED" = "success" ] && [ "$TRAILERS_DEGRADED" = "true" ]; then
            title="Trailer lookup degraded"
            body="The feed was published, but TMDB trailer lookups fail (token missing or rejected, or the API changed); new items get no trailer link. Run: $RUN_URL"
          elif [ "$COMMITTED" = "success" ] && [ "$KINO_DEGRADED" = "true" ]; then
            title="Cinema lookup degraded"
            body="The feed was published, but the Munich cinema programme (indiekino, Cinema Filmtheater), kinoheld or TMDB could not be read; new cinema movies have no or a partial cinema line. Run: $RUN_URL"
          else
            title="Feed build is failing"
            body="The scheduled feed build failed and left the previous feed.xml in place (fail-closed), so the published feed is now going stale. Run: $RUN_URL"
          fi
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
